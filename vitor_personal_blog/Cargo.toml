[package]
name = "vitor_personal_blog"
version = "0.1.0"
edition = "2024"

[dependencies]
jiff = "0.2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10"
toasty = { version = "0.11", features = ["sqlite"] }
toasty-cli = "0.11"
tokio = { version = "1.51.1", features = ["fs", "macros", "rt-multi-thread"] }
topcoat = { version = "0.11.0", default-features = false, features = ["asset", "cookie", "discover", "font-fontsource", "fs", "icon-iconify", "router", "runtime", "serve", "sitemap", "tailwind", "ui", "view"] }

[build-dependencies]
topcoat = { version = "0.11.0", default-features = false, features = ["icon-iconify", "tailwind"] }

# Speed up compilation while keeping file and line numbers in error backtraces.
[profile.dev]
debug = "line-tables-only"

# Speed up compilation by skipping debug information for dependencies.
[profile.dev.package."*"]
debug = false
